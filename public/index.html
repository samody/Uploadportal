<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure File Portal</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page-center">
  <div class="card" style="text-align:center;max-width:440px">

    <div class="portal-emblem">✦</div>

    <h1 style="margin-bottom:8px">Access Portal</h1>
    <p class="subtitle">Enter your access code to continue.</p>

    <div id="code-alert" class="alert"></div>

    <form id="code-form">
      <div class="form-group">
        <div class="code-input-row">
          <input type="text" id="code-input" maxlength="8" placeholder="_ _ _ _ _ _"
                 autocomplete="off" spellcheck="false" autofocus>
          <button type="submit" class="btn btn-primary">Go</button>
        </div>
      </div>
    </form>

    <p class="mt-24 text-muted text-sm">
      <a href="/admin">Admin Access</a>
    </p>
  </div>
</div>

<script>
document.getElementById('code-form').addEventListener('submit', async e => {
  e.preventDefault();
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  if (!code) return;

  const alertEl = document.getElementById('code-alert');
  alertEl.classList.remove('show');

  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = '...';

  try {
    const r = await fetch(`/api/resolve-code?code=${encodeURIComponent(code)}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Invalid code');

    if (data.type === 'upload') {
      location.href = `/upload?code=${encodeURIComponent(data.code)}`;
    } else if (data.type === 'share') {
      location.href = `/share?code=${encodeURIComponent(data.code)}`;
    }
  } catch (err) {
    alertEl.className = 'alert alert-error show';
    alertEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Go';
  }
});
</script>
</body>
</html>
