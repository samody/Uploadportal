<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropShare — Secure File Portal</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page-center">
  <div class="card" style="text-align:center;max-width:500px">
    <div class="brand" style="justify-content:center;margin-bottom:24px">
      <div class="brand-icon" style="width:56px;height:56px;font-size:26px">📁</div>
      <div>
        <div class="brand-name" style="font-size:24px">DropShare</div>
        <div class="brand-sub">Secure File Portal</div>
      </div>
    </div>

    <p class="subtitle" style="margin-bottom:32px">
      Upload and share files securely using access codes or direct links.
      All transfers are managed by your admin.
    </p>

    <div style="display:flex;flex-direction:column;gap:12px">
      <a href="/upload" class="btn btn-primary btn-full" style="font-size:15px;padding:12px">
        ☁️ Upload a File
      </a>
      <a href="/share" class="btn btn-ghost btn-full" style="font-size:15px;padding:12px">
        ⬇ Download / Access Shared File
      </a>
    </div>

    <p class="mt-24 text-muted text-sm">
      Need to manage files? <a href="/admin">Admin Portal</a>
    </p>
  </div>
</div>
</body>
</html>
